
name: Build Wissam Vault APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p Wissam_Vault_Android_v1.1_GitHub_Upload_Fresh :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WissamVault-APK
          path: Wissam_Vault_Android_v1.1_GitHub_Upload_Fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
